name: Test

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -p tsconfig.node.json --noEmit
      - run: npx tsc -p tsconfig.web.json --noEmit
