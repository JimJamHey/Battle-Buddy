name: Release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-test.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: [test, version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version
      - run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK && 'true' || 'false' }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/BattleBuddy-Setup.exe
            release/BattleBuddy-windows.zip
            release/latest.yml
          if-no-files-found: error

  macos:
    needs: [test, version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version
      - name: Build macOS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            export CSC_FOR_PULL_REQUEST=true
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
          if-no-files-found: error

  publish:
    needs: [windows, macos, version]
    if: |
      always() &&
      needs.windows.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: windows
      - uses: actions/download-artifact@v4
        if: needs.macos.result == 'success'
        with:
          path: dist
          pattern: macos
      # electron-updater's GitHub provider looks for <channel>.yml (test.yml / test-mac.yml)
      # before falling back to latest.yml. Keep both so already-installed testers can download.
      - name: Alias prerelease channel files
        run: |
          set -euo pipefail
          if [[ -f dist/windows/latest.yml ]]; then
            cp dist/windows/latest.yml dist/windows/test.yml
          fi
          if [[ -f dist/macos/latest-mac.yml ]]; then
            cp dist/macos/latest-mac.yml dist/macos/test-mac.yml
          fi
      - id: release-files
        run: |
          files=(
            dist/windows/BattleBuddy-Setup.exe
            dist/windows/BattleBuddy-windows.zip
            dist/windows/latest.yml
          )
          if [[ -f dist/windows/test.yml ]]; then
            files+=(dist/windows/test.yml)
          fi
          if [ -d dist/macos ]; then
            shopt -s nullglob
            for f in dist/macos/*.dmg dist/macos/*.zip dist/macos/*.yml; do
              files+=("$f")
            done
          fi
          {
            echo 'files<<EOF'
            printf '%s\n' "${files[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'test' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Test build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
          overwrite_files: true
          files: ${{ steps.release-files.outputs.files }}
          body: |
            Build `${{ github.sha }}` (`${{ needs.version.outputs.version }}`).

            **Windows**
            - `BattleBuddy-Setup.exe` — double-click to install (auto-update on this test channel)
            - `BattleBuddy-windows.zip` — unzip and run `BattleBuddy.exe`
            - If SmartScreen warns about an unknown publisher: **More info** → **Run anyway** (one time)

            **macOS**
            - `BattleBuddy.dmg` — drag to Applications
            - If macOS blocks the first open: right-click **BattleBuddy** → **Open**, then confirm

            Start BattleBuddy, then Hearthstone. The overlay follows the game window.
      # Rolling tag `test` is not valid semver. GitHub-provider clients (v0.1.0-test.26 and
      # earlier) skip it in releases.atom and cannot download. Mirror the same assets onto a
      # versioned prerelease tag so those launchers can update.
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: ${{ steps.release-files.outputs.files }}
          body: |
            Build `${{ github.sha }}` (`${{ needs.version.outputs.version }}`).

            **Windows**
            - `BattleBuddy-Setup.exe` — double-click to install (auto-update on this test channel)
            - `BattleBuddy-windows.zip` — unzip and run `BattleBuddy.exe`
            - If SmartScreen warns about an unknown publisher: **More info** → **Run anyway** (one time)

            **macOS**
            - `BattleBuddy.dmg` — drag to Applications
            - If macOS blocks the first open: right-click **BattleBuddy** → **Open**, then confirm

            Start BattleBuddy, then Hearthstone. The overlay follows the game window.
