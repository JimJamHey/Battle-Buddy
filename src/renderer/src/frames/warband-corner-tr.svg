<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88">
<g transform="scale(-1,1) translate(-88,0)">
<defs>
    <linearGradient id="w-steel-v" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="w-steel-h" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="w-red-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w-green-glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <filter id="w-glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Steel beam  vertical -->
  <rect x="0" y="14" width="14" height="74" fill="url(#w-steel-v)"/>
  <!-- Steel beam  horizontal -->
  <rect x="14" y="0" width="74" height="14" fill="url(#w-steel-h)"/>
  <!-- Corner block -->
  <rect x="0" y="0" width="18" height="18" fill="#64748b"/>

  <!-- Red glow at top -->
  <rect x="0" y="0" width="14" height="40" fill="url(#w-red-glow)" opacity="0.6"/>
  <rect x="0" y="0" width="60" height="14" fill="url(#w-red-glow)" opacity="0.6"/>

  <!-- Green glow at bottom -->
  <rect x="0" y="48" width="14" height="40" fill="url(#w-green-glow)" opacity="0.6"/>

  <!-- Sword shape  diagonal across corner -->
  <g filter="url(#w-glow)">
    <!-- Blade -->
    <polygon points="2,2 6,0 52,46 48,50" fill="#c8d8e8" opacity="0.9"/>
    <polygon points="4,1 6,0 52,46 50,48" fill="white" opacity="0.6"/>
    <!-- Guard -->
    <rect x="22" y="18" width="14" height="4" rx="1" transform="rotate(45 29 20)" fill="#94a3b8"/>
    <rect x="23" y="19" width="12" height="2" rx="0.5" transform="rotate(45 29 20)" fill="#e2e8f0"/>
    <!-- Hilt -->
    <rect x="42" y="42" width="6" height="10" rx="1" transform="rotate(45 45 47)" fill="#8a5022"/>
    <rect x="43" y="43" width="4" height="8" rx="0.5" transform="rotate(45 45 47)" fill="#a06030"/>
    <!-- Tip -->
    <polygon points="2,0 0,2 4,2" fill="#e2e8f0"/>
  </g>

  <!-- Banner ribbon  torn fabric -->
  <path d="M18 0 Q24 4 20 8 Q26 12 22 16 L14 16 L14 0 Z" fill="#fb7185" opacity="0.8"/>
  <path d="M14 0 Q18 4 16 8 Q20 12 18 16 L14 16 Z" fill="#f43f5e" opacity="0.6"/>
  <!-- Torn fabric jagged edge -->
  <polyline points="22,0 19,3 23,5 18,8 22,11 17,14 20,16" fill="none" stroke="#fda4af" stroke-width="0.8" opacity="0.7"/>

  <!-- Rivet on corner -->
  <circle cx="9" cy="9" r="4" fill="#475569"/>
  <circle cx="9" cy="9" r="2.5" fill="#94a3b8"/>
  <circle cx="9" cy="9" r="1" fill="#e2e8f0"/>

  <!-- Metal edge highlight -->
  <line x1="14" y1="0" x2="14" y2="88" stroke="#cbd5e1" stroke-width="0.8" opacity="0.5"/>
  <line x1="0" y1="14" x2="88" y2="14" stroke="#cbd5e1" stroke-width="0.8" opacity="0.5"/>
  <!-- Inner shadow -->
  <line x1="15" y1="0" x2="15" y2="88" stroke="#1e293b" stroke-width="0.6" opacity="0.4"/>
  <line x1="0" y1="15" x2="88" y2="15" stroke="#1e293b" stroke-width="0.6" opacity="0.4"/>
</svg>
