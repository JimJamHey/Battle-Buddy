<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88">
  <defs>
    <linearGradient id="h-wood-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4418"/>
      <stop offset="50%" stop-color="#5a3a14"/>
      <stop offset="100%" stop-color="#3d2209"/>
    </linearGradient>
    <linearGradient id="h-wood-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b4418"/>
      <stop offset="50%" stop-color="#5a3a14"/>
      <stop offset="100%" stop-color="#3d2209"/>
    </linearGradient>
    <linearGradient id="h-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e42" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#e4c278" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e42" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="h-torch" cx="0.15" cy="0.15" r="0.6">
      <stop offset="0%" stop-color="#fff4c2" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#f59e42" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#c2620a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c2620a" stop-opacity="0"/>
    </radialGradient>
    <filter id="h-glow-f" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Torch glow behind everything -->
  <ellipse cx="14" cy="14" rx="36" ry="36" fill="url(#h-torch)"/>

  <!-- Vertical beam -->
  <rect x="0" y="16" width="16" height="72" rx="2" fill="url(#h-wood-v)"/>
  <!-- Horizontal beam -->
  <rect x="16" y="0" width="72" height="16" rx="2" fill="url(#h-wood-h)"/>
  <!-- Corner block -->
  <rect x="0" y="0" width="20" height="20" rx="3" fill="#8a5022"/>

  <!-- Wood grain lines  vertical beam -->
  <line x1="4" y1="20" x2="5" y2="86" stroke="#3d2209" stroke-width="0.6" opacity="0.5"/>
  <line x1="8" y1="20" x2="8.5" y2="86" stroke="#7a4a1a" stroke-width="0.4" opacity="0.4"/>
  <line x1="12" y1="20" x2="11.5" y2="86" stroke="#3d2209" stroke-width="0.5" opacity="0.4"/>

  <!-- Wood grain lines  horizontal beam -->
  <line x1="20" y1="4" x2="86" y2="5" stroke="#3d2209" stroke-width="0.6" opacity="0.5"/>
  <line x1="20" y1="8" x2="86" y2="8.5" stroke="#7a4a1a" stroke-width="0.4" opacity="0.4"/>
  <line x1="20" y1="12" x2="86" y2="11.5" stroke="#3d2209" stroke-width="0.5" opacity="0.4"/>

  <!-- Iron rivets  vertical beam -->
  <circle cx="8" cy="28" r="3.5" fill="#2a2a2a"/>
  <circle cx="8" cy="28" r="2.5" fill="#4a4a4a"/>
  <circle cx="8" cy="28" r="1" fill="#888"/>
  <circle cx="8" cy="50" r="3.5" fill="#2a2a2a"/>
  <circle cx="8" cy="50" r="2.5" fill="#4a4a4a"/>
  <circle cx="8" cy="50" r="1" fill="#888"/>
  <circle cx="8" cy="72" r="3.5" fill="#2a2a2a"/>
  <circle cx="8" cy="72" r="2.5" fill="#4a4a4a"/>
  <circle cx="8" cy="72" r="1" fill="#888"/>

  <!-- Iron rivets  horizontal beam -->
  <circle cx="28" cy="8" r="3.5" fill="#2a2a2a"/>
  <circle cx="28" cy="8" r="2.5" fill="#4a4a4a"/>
  <circle cx="28" cy="8" r="1" fill="#888"/>
  <circle cx="50" cy="8" r="3.5" fill="#2a2a2a"/>
  <circle cx="50" cy="8" r="2.5" fill="#4a4a4a"/>
  <circle cx="50" cy="8" r="1" fill="#888"/>
  <circle cx="72" cy="8" r="3.5" fill="#2a2a2a"/>
  <circle cx="72" cy="8" r="2.5" fill="#4a4a4a"/>
  <circle cx="72" cy="8" r="1" fill="#888"/>

  <!-- Amber torch flame -->
  <g filter="url(#h-glow-f)">
    <path d="M10 16 Q6 8 10 2 Q14 8 18 4 Q16 12 10 16Z" fill="#f59e42"/>
    <path d="M10 14 Q8 9 10 5 Q12 9 14 7 Q13 11 10 14Z" fill="#fff4c2"/>
    <path d="M10 15 Q7 11 10 7 Q13 11 10 15Z" fill="#fbbf24" opacity="0.7"/>
  </g>

  <!-- Corner bracket highlight -->
  <rect x="0" y="0" width="20" height="20" rx="3" fill="none" stroke="#e4c278" stroke-width="1.2" opacity="0.6"/>
</svg>
