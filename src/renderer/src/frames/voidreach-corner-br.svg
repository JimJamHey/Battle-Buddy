<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88">
<g transform="scale(-1,-1) translate(-88,-88)">
<defs>
    <radialGradient id="v-void" cx="0.05" cy="0.05" r="0.9">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.9"/>
      <stop offset="20%" stop-color="#c026d3" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#4c1d95" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d0014" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="v-eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#67e8f9" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#c026d3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d0014" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="v-tendril-m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="v-tendril-c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>
    <filter id="v-glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="v-soft">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Deep void base -->
  <rect width="88" height="88" fill="#0d0014"/>
  <!-- Void radial -->
  <rect width="88" height="88" fill="url(#v-void)"/>

  <!-- Obsidian frame beams -->
  <rect x="0" y="0" width="16" height="88" fill="#0d0014" opacity="0.7"/>
  <rect x="0" y="0" width="88" height="16" fill="#0d0014" opacity="0.7"/>

  <!-- Bioluminescent magenta tendrils -->
  <g filter="url(#v-glow)" opacity="0.9">
    <path d="M0,0 Q8,20 4,40 Q2,55 6,70 Q8,80 4,88" fill="none" stroke="#e879f9" stroke-width="2.5"/>
    <path d="M0,0 Q15,8 30,5 Q50,2 65,6 Q78,8 88,4" fill="none" stroke="#e879f9" stroke-width="2.5"/>
    <path d="M2,0 Q10,12 8,28" fill="none" stroke="#c026d3" stroke-width="1.5"/>
    <path d="M0,2 Q12,10 28,8" fill="none" stroke="#c026d3" stroke-width="1.5"/>
  </g>

  <!-- Cyan tendrils -->
  <g filter="url(#v-glow)" opacity="0.8">
    <path d="M0,0 Q4,30 2,50 Q0,65 4,80" fill="none" stroke="#67e8f9" stroke-width="1.8"/>
    <path d="M0,0 Q20,4 42,2 Q60,0 80,4" fill="none" stroke="#67e8f9" stroke-width="1.8"/>
    <path d="M0,0 Q6,18 3,35 Q1,45 3,55" fill="none" stroke="#22d3ee" stroke-width="1"/>
    <path d="M0,0 Q18,6 35,3 Q45,1 55,3" fill="none" stroke="#22d3ee" stroke-width="1"/>
  </g>

  <!-- Void eye at corner -->
  <g filter="url(#v-glow)">
    <ellipse cx="8" cy="8" rx="7" ry="7" fill="url(#v-eye)"/>
    <ellipse cx="8" cy="8" rx="3.5" ry="5" fill="#0d0014" opacity="0.9"/>
    <ellipse cx="8" cy="8" rx="1.5" ry="2.5" fill="#c026d3" opacity="0.8"/>
    <ellipse cx="7" cy="7" rx="0.6" ry="0.8" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Tendril branches off main -->
  <g opacity="0.6">
    <path d="M4,15 Q10,20 8,30" fill="none" stroke="#e879f9" stroke-width="1"/>
    <path d="M4,30 Q10,35 7,44" fill="none" stroke="#e879f9" stroke-width="0.8"/>
    <path d="M15,4 Q20,10 30,8" fill="none" stroke="#e879f9" stroke-width="1"/>
    <path d="M30,4 Q35,10 44,7" fill="none" stroke="#e879f9" stroke-width="0.8"/>
    <path d="M3,20 Q8,25 5,34" fill="none" stroke="#67e8f9" stroke-width="0.7"/>
    <path d="M20,3 Q25,8 34,5" fill="none" stroke="#67e8f9" stroke-width="0.7"/>
  </g>

  <!-- Stars/spores -->
  <circle cx="20" cy="25" r="1" fill="#e879f9" opacity="0.8"/>
  <circle cx="25" cy="10" r="0.8" fill="#67e8f9" opacity="0.8"/>
  <circle cx="10" cy="38" r="0.7" fill="#e879f9" opacity="0.6"/>
  <circle cx="38" cy="10" r="0.7" fill="#67e8f9" opacity="0.6"/>
  <circle cx="6" cy="55" r="0.9" fill="#c026d3" opacity="0.7"/>
  <circle cx="55" cy="6" r="0.9" fill="#c026d3" opacity="0.7"/>
  <circle cx="7" cy="72" r="0.6" fill="#67e8f9" opacity="0.5"/>
  <circle cx="72" cy="7" r="0.6" fill="#67e8f9" opacity="0.5"/>

  <!-- Edge highlight -->
  <line x1="16" y1="0" x2="16" y2="88" stroke="#c026d3" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="16" x2="88" y2="16" stroke="#c026d3" stroke-width="1" opacity="0.5"/>
</svg>
