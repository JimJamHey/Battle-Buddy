<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 230">
<g transform="scale(-1,1) translate(-58,0)">
<defs>
    <linearGradient id="vs-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0014"/>
      <stop offset="50%" stop-color="#1a0030"/>
      <stop offset="100%" stop-color="#0d0014"/>
    </linearGradient>
    <linearGradient id="vs-m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0"/>
      <stop offset="30%" stop-color="#e879f9" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#c026d3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c026d3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vs-c1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="40%" stop-color="#67e8f9" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="vss-glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="58" height="230" fill="url(#vs-bg)"/>

  <!-- Main void channel -->
  <rect x="0" y="0" width="16" height="230" fill="#0d0014" opacity="0.8"/>

  <!-- Magenta tendril running length -->
  <g filter="url(#vss-glow)">
    <path d="M4,0 Q8,30 5,60 Q2,90 6,115 Q10,140 5,170 Q2,200 6,230" fill="none" stroke="#e879f9" stroke-width="2.5"/>
    <path d="M10,0 Q14,25 11,55 Q8,85 12,110 Q16,135 11,165 Q8,195 12,230" fill="none" stroke="#c026d3" stroke-width="1.5"/>
  </g>

  <!-- Cyan tendril -->
  <g filter="url(#vss-glow)">
    <path d="M2,0 Q6,35 3,70 Q0,105 4,140 Q8,165 3,200 Q0,215 4,230" fill="none" stroke="#67e8f9" stroke-width="1.8"/>
  </g>

  <!-- Side branches at intervals -->
  <g opacity="0.7">
    <path d="M6,45 Q20,40 35,44" fill="none" stroke="#e879f9" stroke-width="1.2"/>
    <path d="M6,80 Q18,76 28,80" fill="none" stroke="#67e8f9" stroke-width="1"/>
    <path d="M6,115 Q22,110 40,114" fill="none" stroke="#e879f9" stroke-width="1.4"/>
    <path d="M6,150 Q20,146 32,150" fill="none" stroke="#67e8f9" stroke-width="1"/>
    <path d="M6,185 Q24,180 38,184" fill="none" stroke="#e879f9" stroke-width="1.2"/>
  </g>

  <!-- Eye nodes at intervals -->
  <g filter="url(#vss-glow)">
    <ellipse cx="8" cy="57" rx="5" ry="7" fill="#0d0014"/>
    <ellipse cx="8" cy="57" rx="3" ry="4.5" fill="#c026d3" opacity="0.7"/>
    <ellipse cx="8" cy="57" rx="1.2" ry="2" fill="#e879f9"/>
    <circle cx="7.2" cy="55.5" r="0.7" fill="white" opacity="0.9"/>

    <ellipse cx="8" cy="115" rx="5" ry="7" fill="#0d0014"/>
    <ellipse cx="8" cy="115" rx="3" ry="4.5" fill="#4c1d95" opacity="0.8"/>
    <ellipse cx="8" cy="115" rx="1.2" ry="2" fill="#67e8f9"/>
    <circle cx="7.2" cy="113.5" r="0.7" fill="white" opacity="0.9"/>

    <ellipse cx="8" cy="173" rx="5" ry="7" fill="#0d0014"/>
    <ellipse cx="8" cy="173" rx="3" ry="4.5" fill="#c026d3" opacity="0.7"/>
    <ellipse cx="8" cy="173" rx="1.2" ry="2" fill="#e879f9"/>
    <circle cx="7.2" cy="171.5" r="0.7" fill="white" opacity="0.9"/>
  </g>

  <!-- Spore dots -->
  <circle cx="22" cy="30" r="1.2" fill="#e879f9" opacity="0.7"/>
  <circle cx="38" cy="65" r="0.9" fill="#67e8f9" opacity="0.6"/>
  <circle cx="28" cy="100" r="1" fill="#c026d3" opacity="0.7"/>
  <circle cx="42" cy="135" r="0.9" fill="#e879f9" opacity="0.6"/>
  <circle cx="20" cy="160" r="1.1" fill="#67e8f9" opacity="0.7"/>
  <circle cx="36" cy="195" r="1" fill="#e879f9" opacity="0.6"/>

  <!-- Edge glow -->
  <rect x="14" y="0" width="3" height="230" fill="#c026d3" opacity="0.25"/>
  <rect x="55" y="0" width="3" height="230" fill="#4c1d95" opacity="0.15"/>
</svg>
