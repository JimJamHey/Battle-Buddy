<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88">
  <defs>
    <linearGradient id="c-crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="40%" stop-color="#a78bfa"/>
      <stop offset="80%" stop-color="#f0c96a"/>
      <stop offset="100%" stop-color="#1a0a30"/>
    </linearGradient>
    <linearGradient id="c-spire1" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0%" stop-color="#1a0a30"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#e0d4ff"/>
    </linearGradient>
    <linearGradient id="c-spire2" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0%" stop-color="#1a0a30"/>
      <stop offset="50%" stop-color="#f0c96a"/>
      <stop offset="100%" stop-color="#fffde4"/>
    </linearGradient>
    <linearGradient id="c-spire3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a0a30"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <radialGradient id="c-glow" cx="0.1" cy="0.1" r="0.7">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1a0a30" stop-opacity="0"/>
    </radialGradient>
    <filter id="c-blur">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background glow -->
  <rect width="88" height="88" fill="url(#c-glow)"/>

  <!-- Base dark frame corner block -->
  <rect x="0" y="0" width="88" height="14" rx="0" fill="#1a0a30" opacity="0.85"/>
  <rect x="0" y="0" width="14" height="88" rx="0" fill="#1a0a30" opacity="0.85"/>
  <rect x="0" y="0" width="20" height="20" fill="#1a0a30"/>

  <!-- Crystal facet fill on beams -->
  <rect x="0" y="0" width="88" height="14" fill="url(#c-crystal)" opacity="0.35"/>
  <rect x="0" y="0" width="14" height="88" fill="url(#c-crystal)" opacity="0.35"/>

  <!-- Facet lines on horizontal beam -->
  <polyline points="20,0 30,14 44,0 58,14 72,0 88,14" fill="none" stroke="#a78bfa" stroke-width="0.7" opacity="0.7"/>
  <polyline points="20,14 30,0 44,14 58,0 72,14 88,0" fill="none" stroke="#22d3ee" stroke-width="0.5" opacity="0.5"/>

  <!-- Facet lines on vertical beam -->
  <polyline points="0,20 14,30 0,44 14,58 0,72 14,88" fill="none" stroke="#a78bfa" stroke-width="0.7" opacity="0.7"/>
  <polyline points="14,20 0,30 14,44 0,58 14,72 0,88" fill="none" stroke="#22d3ee" stroke-width="0.5" opacity="0.5"/>

  <!-- Crystal spires at corner  tall center, shorter flanks -->
  <g filter="url(#c-blur)">
    <!-- tallest center spire -->
    <polygon points="10,44 6,20 10,2 14,20" fill="url(#c-spire1)" opacity="0.95"/>
    <polygon points="10,2 8,14 10,0 12,14" fill="#e0d4ff" opacity="0.9"/>
    <!-- left flanking spire -->
    <polygon points="4,38 2,22 4,10 8,22" fill="url(#c-spire3)" opacity="0.8"/>
    <!-- right flanking spire on horizontal -->
    <polygon points="44,10 20,6 2,10 20,14" fill="url(#c-spire2)" opacity="0.95"/>
    <polygon points="2,10 14,8 0,10 14,12" fill="#fffde4" opacity="0.9"/>
    <polygon points="38,4 22,2 10,4 22,8" fill="url(#c-spire1)" opacity="0.8"/>
  </g>

  <!-- Gold trim line -->
  <line x1="14" y1="0" x2="14" y2="88" stroke="#f0c96a" stroke-width="1.5" opacity="0.7"/>
  <line x1="0" y1="14" x2="88" y2="14" stroke="#f0c96a" stroke-width="1.5" opacity="0.7"/>

  <!-- Cyan highlight inner edge -->
  <line x1="16" y1="0" x2="16" y2="88" stroke="#22d3ee" stroke-width="0.7" opacity="0.4"/>
  <line x1="0" y1="16" x2="88" y2="16" stroke="#22d3ee" stroke-width="0.7" opacity="0.4"/>

  <!-- Corner gem -->
  <polygon points="10,10 7,7 10,4 13,7" fill="#f0c96a"/>
  <polygon points="10,10 7,7 10,4 13,7" fill="none" stroke="#fff" stroke-width="0.6" opacity="0.8"/>
  <circle cx="10" cy="7" r="1.5" fill="#fffde4" opacity="0.9"/>
</svg>
